<div class="landing-page">
  <section class="hero">
    <div class="hero__content">
      <h1 class="hero__title">Controle suas horas de trabalho de forma simples</h1>
      <p class="hero__subtitle">Registre seu tempo de trabalho, acompanhe suas horas e gere relatórios corporativos. Uma solução simples para monitorar sua produtividade e de sua empresa.</p>
      <div class="hero__actions">
        <app-button
          [text]="'Começar Agora'"
          [color]="'primary'"
          [rounded]="true"
          (buttonClick)="openLogin()"
        ></app-button>
      </div>
    </div>
  </section>
</div>
