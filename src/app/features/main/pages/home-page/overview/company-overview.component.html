<div class="company-nav">
  <!-- Cabeçalho da empresa -->
  <div class="company-nav__header">
    <div class="company-nav__company-icon">
      <app-icon name="objects/building" size="1.25rem" />
    </div>
    <div class="company-nav__header-info">
      <span class="company-nav__company-label">{{ 'home.overview.company' | translate }}</span>
      <span class="company-nav__company-name">{{ companyName() }}</span>
    </div>
  </div>

  <!-- Lista de navegação -->
  <nav class="company-nav__list" aria-label="Navegação da empresa">
    @if (loading()) {
      @for (s of [1, 2, 3, 4, 5]; track s) {
        <div class="company-nav__item company-nav__item--skeleton" aria-hidden="true">
          <div class="company-nav__skeleton-icon"></div>
          <div class="company-nav__skeleton-label"></div>
        </div>
      }
    } @else {
      @for (item of navItems; track item.view) {
        <button
          type="button"
          class="company-nav__item"
          [class.company-nav__item--active]="activeView === item.view"
          [class.company-nav__item--alert]="item.badgeText() !== null"
          (click)="navigate.emit(item.view)"
          [attr.aria-current]="activeView === item.view ? 'page' : null"
        >
          <div class="company-nav__item-icon">
            <app-icon [name]="item.icon" size="1rem" />
          </div>
          <span class="company-nav__item-label">{{ item.labelKey | translate }}</span>
          @if (item.badgeText() !== null) {
            <span class="company-nav__item-count company-nav__item-count--alert">
              {{ item.badgeText() }}
            </span>
          }
        </button>
      }
    }
  </nav>
</div>
