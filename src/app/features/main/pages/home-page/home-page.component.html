<div class="home-page">
  <div class="home-page__grid">
    <section class="home-page__panel home-page__panel--actions">
      <div class="quick-actions">
        @for (action of quickActions(); track action.id) {
          <button type="button" class="quick-actions__item">
            <span class="quick-actions__label">{{ action.label | translate }}</span>
          </button>
        }
      </div>
    </section>

    <div class="home-page__divider" aria-hidden="true"></div>

    <section
      class="home-page__panel home-page__panel--entries"
      aria-labelledby="latest-entries-heading"
    >
      <h2 id="latest-entries-heading" class="home-page__panel-title">
        {{ 'home.latestEntries.title' | translate }}
      </h2>

      <app-recent-time-entries />
    </section>
  </div>
</div>
