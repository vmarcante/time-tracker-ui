<app-dialog-shell>
  <div class="project-dialog">
    <section class="project-dialog__header">
      <h2 class="project-dialog__title">
        @if (isEdit()) {
          {{ 'workspace.projects.dialog.title.edit' | translate }}
        } @else {
          {{ 'workspace.projects.dialog.title.create' | translate }}
        }
      </h2>
      <p class="project-dialog__subtitle">
        @if (isEdit()) {
          {{ 'workspace.projects.dialog.subtitle.edit' | translate }}
        } @else {
          {{ 'workspace.projects.dialog.subtitle.create' | translate }}
        }
      </p>
    </section>

    <div class="project-dialog__fields">
      <app-text-input
        [control]="nameControl"
        [labelIcon]="'objects/folder'"
        [label]="'workspace.projects.dialog.name.label' | translate"
        [placeholder]="'workspace.projects.dialog.name.placeholder' | translate"
        [required]="true"
      />
      <app-text-input
        [control]="clientNameControl"
        [labelIcon]="'objects/person'"
        [label]="'workspace.projects.dialog.clientName.label' | translate"
        [placeholder]="'workspace.projects.dialog.clientName.placeholder' | translate"
        [required]="true"
      />
      <app-textarea-input
        [control]="descriptionControl"
        [labelIcon]="'objects/text-file'"
        [label]="'workspace.projects.dialog.description.label' | translate"
        [placeholder]="'workspace.projects.dialog.description.placeholder' | translate"
        [hint]="'workspace.projects.dialog.description.hint' | translate"
        [rows]="3"
        [showCounter]="false"
      />
      <app-daterange-input
        [formGroup]="datesGroup"
        [label]="'workspace.projects.dialog.dates.label' | translate"
        [startLabel]="'workspace.projects.dialog.dates.start' | translate"
        [endLabel]="'workspace.projects.dialog.dates.end' | translate"
        [separator]="'workspace.projects.dialog.dates.separator' | translate"
        [hint]="'workspace.projects.dialog.dates.hint' | translate"
        [errorMessages]="dateErrorMessages"
      />
    </div>

    <div class="project-dialog__actions">
      <app-button
        type="button"
        color="outline-white"
        [rounded]="true"
        [text]="'common.dialog.cancel' | translate"
        (buttonClick)="cancel()"
      />
      <app-button
        type="button"
        color="primary"
        [rounded]="true"
        [text]="(isEdit() ? 'workspace.projects.dialog.submit.edit' : 'workspace.projects.dialog.submit.create') | translate"
        [icon]="{ iconName: 'status/check', svgIcon: true, color: '#FFF', position: 'right' }"
        (buttonClick)="confirm()"
      />
    </div>
  </div>
</app-dialog-shell>
