<app-dialog-shell>
  <div class="team-dialog">
    <section class="team-dialog__header">
      <h2 class="team-dialog__title">
        @if (isEdit()) {
          {{ 'workspace.teams.dialog.title.edit' | translate }}
        } @else {
          {{ 'workspace.teams.dialog.title.create' | translate }}
        }
      </h2>
      <p class="team-dialog__subtitle">
        @if (isEdit()) {
          {{ 'workspace.teams.dialog.subtitle.edit' | translate }}
        } @else {
          {{ 'workspace.teams.dialog.subtitle.create' | translate }}
        }
      </p>
    </section>

    <div class="team-dialog__fields">
      <app-text-input
        [control]="nameControl"
        [labelIcon]="'objects/layers'"
        [label]="'workspace.teams.dialog.name.label' | translate"
        [placeholder]="'workspace.teams.dialog.name.placeholder' | translate"
        [required]="true"
      />
      <app-textarea-input
        [control]="descriptionControl"
        [labelIcon]="'objects/text-file'"
        [label]="'workspace.teams.dialog.description.label' | translate"
        [placeholder]="'workspace.teams.dialog.description.placeholder' | translate"
        [hint]="'workspace.teams.dialog.description.hint' | translate"
        [rows]="3"
        [showCounter]="false"
      />
    </div>

    <div class="team-dialog__actions">
      <app-button
        type="button"
        color="outline-white"
        [rounded]="true"
        [text]="'common.dialog.cancel' | translate"
        (buttonClick)="cancel()"
      />
      <app-button
        type="button"
        color="primary"
        [rounded]="true"
        [text]="(isEdit() ? 'workspace.teams.dialog.submit.edit' : 'workspace.teams.dialog.submit.create') | translate"
        [icon]="{ iconName: 'status/check', svgIcon: true, color: '#FFF', position: 'right' }"
        (buttonClick)="confirm()"
      />
    </div>
  </div>
</app-dialog-shell>
