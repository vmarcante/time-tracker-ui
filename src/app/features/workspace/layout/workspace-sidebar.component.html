<div class="workspace-nav">
  <!-- Cabeçalho da empresa -->
  <a
    #home
    class="workspace-nav__header"
    routerLink="/workspace"
    routerLinkActive="workspace-nav__header--active"
    [routerLinkActiveOptions]="{ exact: true }"
    (isActiveChange)="revealActive($event, home)"
    [attr.aria-label]="'workspace.overview.title' | translate"
  >
    <div class="workspace-nav__company-icon">
      <app-icon name="objects/building" size="1.25rem" />
    </div>
    <div class="workspace-nav__header-info">
      <span class="workspace-nav__company-label">{{ 'workspace.overview.company' | translate }}</span>
      <span class="workspace-nav__company-name">{{ companyName() }}</span>
    </div>
  </a>

  <!-- Lista de navegação -->
  <nav class="workspace-nav__list" [attr.aria-label]="'workspace.overview.company' | translate">
    @if (loading()) {
      @for (s of [1, 2, 3, 4, 5]; track s) {
        <div class="workspace-nav__item workspace-nav__item--skeleton" aria-hidden="true">
          <div class="workspace-nav__skeleton-icon"></div>
          <div class="workspace-nav__skeleton-label"></div>
        </div>
      }
    } @else {
      @for (item of navItems(); track item.route) {
        <a
          #link
          class="workspace-nav__item"
          [routerLink]="item.route"
          routerLinkActive="workspace-nav__item--active"
          (isActiveChange)="revealActive($event, link)"
          [class.workspace-nav__item--alert]="item.badgeText() !== null"
          [attr.aria-current]="null"
        >
          <div class="workspace-nav__item-icon">
            <app-icon [name]="item.icon" size="1rem" />
          </div>
          <span class="workspace-nav__item-label">{{ item.labelKey | translate }}</span>
          @if (item.badgeText() !== null) {
            <span class="workspace-nav__item-count workspace-nav__item-count--alert">
              {{ item.badgeText() }}
            </span>
          }
        </a>
      }
    }
  </nav>
</div>
