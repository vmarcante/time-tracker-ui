<div class="user-menu">

  <!-- Cabeçalho: nome + email -->
  <div class="user-menu__header">
    <div class="user-menu__info">
      <span class="user-menu__name">{{ user().name }}</span>
      <span class="user-menu__email">{{ user().email }}</span>
    </div>
  </div>

  <!-- Ações -->
  <div class="user-menu__actions">

    <!-- Meu perfil -->
    <button
      type="button"
      class="user-menu__action"
      (click)="profileClick.emit()"
    >
      <app-icon name="objects/person" size="1.125rem" />
      <span>{{ 'header.userMenu.profile' | translate }}</span>
    </button>

  </div>

  <div class="user-menu__divider" role="separator"></div>

  <!-- Sair -->
  <div class="user-menu__actions">
    <button
      type="button"
      class="user-menu__action user-menu__action--danger"
      (click)="logout.emit()"
    >
      <app-icon name="actions/logout" size="1.125rem" />
      <span>{{ 'header.logoutAriaLabel' | translate }}</span>
    </button>

</div>
