@if (alertData) {
  <div
    class="toastr-wrapper"
    [ngClass]="alertData.type + '-toastr'"
    role="alert"
    [attr.aria-live]="alertData.type === 'error' ? 'assertive' : 'polite'"
  >
    <div class="toastr-icon-wrapper" aria-hidden="true">
      <app-icon
        [name]="iconConfig.name"
        size="var(--toastr-icon-size, 2rem)"
        [attr.aria-label]="iconConfig.altMessage | translate"
      />

      @if (alertData.queueInfo && alertData.queueInfo.total > 1) {
        <div class="toastr-queue-counter">
          {{ alertData.queueInfo.current }}/{{ alertData.queueInfo.total }}
        </div>
      }
    </div>

    <div class="toastr-content-wrapper">
      <p
        class="toastr-text-content"
        [innerHTML]="alertData.messageContent"
        [attr.aria-label]="ariaLabel"
      ></p>

      @if (alertData.button) {
        <button
          type="button"
          class="toastr-custom-button"
          (click)="buttonClickAction()"
          [attr.aria-label]="alertData.button.label || ('common.toastr.actions.buttonAction' | translate)"
        >
          {{ alertData.button.label }}
        </button>
      }
    </div>

    <div class="toastr-actions">
      @if (hasQueue) {
        <button
          type="button"
          class="toastr-clear-queue-button"
          (click)="dismissAlert(true)"
          [attr.aria-label]="'common.toastr.actions.clearQueue' | translate"
        >
          <app-icon name="objects/trash" size="var(--toastr-clear-icon-size, 0.75rem)" />
        </button>
      }

      @if (!hasQueue) {
        <button
          type="button"
          class="toastr-close-button"
          (click)="dismissAlert()"
          [attr.aria-label]="closeButtonAriaLabel"
        >
          <app-icon name="actions/close" size="var(--toastr-action-icon-size, 1.125rem)" />
        </button>
      }

      @if (hasQueue) {
        <button
          type="button"
          class="toastr-next-button"
          (click)="dismissAlert()"
          [attr.aria-label]="'common.toastr.actions.next' | translate"
        >
          <app-icon name="arrows/next" size="var(--toastr-action-icon-size, 1.125rem)" />
        </button>
      }
    </div>

    @if (autoDismissEnabled) {
      <div
        class="toastr-progress-bar"
        [ngClass]="alertData.type + '-progress'"
        [style.animation-duration.ms]="alertData.autoClose?.duration"
      ></div>
    }
  </div>
}
