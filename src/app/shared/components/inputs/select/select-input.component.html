@if (showLabel && label) {
  <label class="select-input-label" [for]="generatedInputId">
    @if (labelIcon) {
      <app-icon
        class="select-input-label__icon"
        [name]="labelIcon"
        [size]="14"
      />
    }
    <span class="select-input-label__text">
      {{ label }}
      @if (required) {
        <span class="select-input-label__required">*</span>
      }
    </span>
  </label>
}

<mat-form-field
  class="mat-select-input-field"
  [class.mat-select-input-field--no-subscript]="hideSubscript"
  appearance="outline"
>
  <mat-select
    [id]="generatedInputId"
    [formControl]="control!"
    [multiple]="multiple"
    [disabled]="readonly || control!.disabled"
    [attr.aria-describedby]="ariaDescribedBy"
    [attr.aria-invalid]="ariaInvalid"
    [attr.aria-required]="ariaRequired"
    [placeholder]="placeholder"
    [panelClass]="panelClass()"
    (selectionChange)="onChange($event)"
  >
    @for (option of options; track option[optionValue]) {
      <mat-option [value]="option[optionValue]" [disabled]="option.disabled">
        {{ option[optionLabel] }}
      </mat-option>
    }
  </mat-select>

  @if (hint && !hideHint) {
    <mat-hint [id]="hintId">{{ hint }}</mat-hint>
  }
  @if (hasError && !hideError) {
    <mat-error [id]="errorId">{{ errorMessage }}</mat-error>
  }
</mat-form-field>
