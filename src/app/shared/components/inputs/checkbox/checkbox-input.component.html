<div class="input-wrapper">
  <label class="checkbox-wrapper" [for]="generatedInputId">
    <input
      type="checkbox"
      class="checkbox-input"
      [id]="generatedInputId"
      [checked]="formControl?.value"
      [disabled]="readonly || formControl!.disabled"
      [indeterminate]="indeterminate"
      [attr.aria-describedby]="ariaDescribedBy"
      [attr.aria-invalid]="ariaInvalid"
      [attr.aria-required]="ariaRequired"
      (change)="onChange($event)"
    />
    <span class="checkbox-mark" [class.indeterminate]="indeterminate"></span>
    <span class="checkbox-label">{{ label }}</span>
  </label>

  @if (hint) {
    <span [id]="hintId" class="input-wrapper__hint">{{ hint }}</span>
  }
  @if (hasError) {
    <span [id]="errorId" class="input-wrapper__error">{{ errorMessage }}</span>
  }
</div>
