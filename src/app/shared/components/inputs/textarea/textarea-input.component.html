@if (showLabel && label) {
  <label class="textarea-input-label" [for]="generatedInputId">
    @if (labelIcon) {
      <app-icon
        class="textarea-input-label__icon"
        [name]="labelIcon"
        [size]="14"
      />
    }
    <span class="textarea-input-label__text">
      {{ label }}
      @if (required) {
        <span class="textarea-input-required">*</span>
      }
    </span>
  </label>
}

<div class="textarea-input-wrapper">
  <mat-form-field class="mat-textarea-field" appearance="outline">
    <textarea
      matInput
      [id]="generatedInputId"
      [name]="generatedInputId"
      [formControl]="control!"
      [placeholder]="placeholder"
      cdkTextareaAutosize
      [cdkAutosizeMinRows]="rows"
      [attr.maxlength]="maxLength"
      [readonly]="readonly"
      [attr.aria-describedby]="ariaDescribedBy"
      [attr.aria-invalid]="ariaInvalid"
      [attr.aria-required]="ariaRequired"
      (input)="onInput($event)"
      (focus)="focus($event)"
      (blur)="blur($event)"
      (focusout)="focusOut($event)"
    ></textarea>
    @if (hint) {
      <mat-hint [id]="hintId">{{ hint }}</mat-hint>
    }
    @if (showCounter && maxLength) {
      <mat-hint align="end" class="textarea-input-counter">{{ currentLength }}/{{ maxLength }}</mat-hint>
    }
    @if (hasError) {
      <mat-error [id]="errorId">{{ errorMessage }}</mat-error>
    }
  </mat-form-field>
</div>
