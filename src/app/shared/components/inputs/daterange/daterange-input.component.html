<div class="input-wrapper">
  @if (label) {
    <label class="input-wrapper__label">
      @if (labelIcon) {
        <app-icon class="input-wrapper__label-icon" [name]="labelIcon" [size]="14" />
      }
      <span class="input-wrapper__label-text">
        {{ label }}
        @if (required) {
          <span class="input-wrapper__required">*</span>
        }
      </span>
    </label>
  }

  <div class="daterange-input-group">
    <app-date-input
      [control]="startControl"
      [showLabel]="false"
      [placeholder]="startLabel"
      [minDate]="minDate"
      [maxDate]="startMaxDate"
      [readonly]="readonly"
      [hideHint]="true"
      [hideError]="hideError"
    />

    <span class="date-separator">{{ separator }}</span>

    <app-date-input
      [control]="endControl"
      [showLabel]="false"
      [placeholder]="endLabel"
      [minDate]="endMinDate"
      [maxDate]="maxDate"
      [readonly]="readonly"
      [hideHint]="true"
      [hideError]="hideError"
    />
  </div>

  @if (hint) {
    <span [id]="hintId" class="input-wrapper__hint">{{ hint }}</span>
  }
  @if (hasError) {
    <span [id]="errorId" class="input-wrapper__error">{{ errorMessage }}</span>
  }
</div>
