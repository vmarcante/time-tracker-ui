<div class="input-wrapper">
  @if (label) {
    <label [id]="generatedInputId" class="input-wrapper__label">{{ label }}</label>
  }
  <mat-radio-group
    [formControl]="control!"
    [disabled]="readonly || control!.disabled"
    [class]="radioGroupClasses"
    [attr.aria-describedby]="ariaDescribedBy"
    [attr.aria-invalid]="ariaInvalid"
    [attr.aria-required]="ariaRequired"
    (change)="onChange($event.value)"
  >
    @for (option of options; track option[optionValue]) {
      <mat-radio-button [value]="option[optionValue]" [disabled]="option.disabled">
        {{ option[optionLabel] }}
      </mat-radio-button>
    }
  </mat-radio-group>

  @if (hint) {
    <span [id]="hintId" class="input-wrapper__hint">{{ hint }}</span>
  }
  @if (hasError) {
    <span [id]="errorId" class="input-wrapper__error">{{ errorMessage }}</span>
  }
</div>
