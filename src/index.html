<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Time Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#1F2937" />
    <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="assets/logos/apple-touch-icon.png" />
  </head>
  <body class="theme-light">
    <app-root></app-root>
    <script>
      // Define o idioma do documento baseado no navegador ou localStorage
      const userLang = localStorage.getItem('app-language') || 
                       navigator.language.split('-')[0] || 
                       'pt';
      document.documentElement.lang = userLang;
    </script>
  </body>
</html>
